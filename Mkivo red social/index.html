<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKIVO</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            flex-direction: column;
        }
        .logo {
            width: 120px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 4em;
            margin: 0;
        }
        p {
            font-size: 1.2em;
            color: #aaa;
        }
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8em;
            color: #555;
        }
    </style>
</head>
<body>
    <img src="./logo.png" alt="Logo MKIVO" class="logo">
    <h1>MKIVO</h1>
    <p>El nexo entre tus ideas y el mundo.</p>
    <div class="footer">© 2026 MKIVO. Todos los derechos reservados.</div>
</body>
</html>
