<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKIVO — Inicia sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --border: #262626;
    --border-focus: #4f7cff;
    --text: #fafafa;
    --text-dim: #8e8e8e;
    --text-faint: #525252;
    --link: #4f9dff;
    --link-hover: #7cb6ff;
    --btn-bg: #fafafa;
    --btn-bg-hover: #e4e4e4;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100%;
  }

  body{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
  }

  /* Textura sutil tipo "red de nodos" — evoca el nexo sin distraer */
  body::before{
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(79,124,255,0.05), transparent 35%),
      radial-gradient(circle at 85% 75%, rgba(79,124,255,0.04), transparent 35%);
    pointer-events: none;
    z-index: 0;
  }

  main{
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    width: 100%;
    animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .auth-card{
    width: 100%;
    max-width: 350px;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 40px 40px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo{
    width: 160px;
    height: auto;
    max-width: 100%;
    object-fit: contain;
    margin-bottom: 16px;
    display: block;
  }

  /* Respaldo textual si logos.png no carga */
  .logo-fallback{
    display: none;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 32px;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }

  .logo.broken{
    display: none;
  }
  .logo.broken + .logo-fallback{
    display: block;
  }

  .tagline{
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 500;
    text-align: center;
    line-height: 1.5;
    margin: 0 0 24px;
    max-width: 260px;
  }

  form{
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field{
    position: relative;
    width: 100%;
  }

  .field input{
    width: 100%;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 13px;
    padding: 13px 12px;
    outline: none;
    transition: border-color 0.15s ease;
    font-family: inherit;
  }

  .field input::placeholder{
    color: var(--text-faint);
  }

  .field input:focus{
    border-color: var(--border-focus);
    box-shadow: 0 0 0 1px var(--border-focus);
  }

  .field input:-webkit-autofill{
    -webkit-box-shadow: 0 0 0 1000px #000 inset;
    -webkit-text-fill-color: var(--text);
  }

  .submit-btn{
    margin-top: 14px;
    width: 100%;
    background: var(--btn-bg);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    font-family: inherit;
  }

  .submit-btn:hover{
    background: var(--btn-bg-hover);
  }

  .submit-btn:active{
    transform: scale(0.98);
  }

  .signup-box{
    width: 100%;
    max-width: 350px;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 20px;
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
  }

  .signup-box a{
    color: var(--link);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.15s ease;
  }

  .signup-box a:hover{
    color: var(--link-hover);
    text-decoration: underline;
  }

  a:focus-visible,
  .submit-btn:focus-visible,
  .field input:focus-visible{
    outline: 2px solid var(--border-focus);
    outline-offset: 2px;
  }

  /* ===== Responsive ===== */
  @media (max-width: 480px){
    .auth-card, .signup-box{
      max-width: 100%;
    }
    .auth-card{
      padding: 32px 24px 20px;
    }
    .logo{
      width: 130px;
    }
  }

  @media (prefers-reduced-motion: reduce){
    main{ animation: none; }
    .submit-btn{ transition: none; }
  }

  /* ===== Toast de notificación ===== */
  .toast{
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-left: 3px solid #34d399;
    border-radius: 6px;
    padding: 14px 18px;
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    max-width: calc(100% - 40px);
    transform: translateX(120%);
    opacity: 0;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
  }

  .toast.show{
    transform: translateX(0);
    opacity: 1;
  }

  .toast-icon{
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    color: #34d399;
  }

  @media (max-width: 480px){
    .toast{
      top: 12px;
      right: 12px;
      left: 12px;
      max-width: none;
    }
  }
</style>
</head>
<body>

  <main>
    <div class="auth-card">
      <img src="logos.png" alt="MKIVO" class="logo" onerror="this.classList.add('broken')">
      <span class="logo-fallback">MKIVO</span>

      <p class="tagline">El nexo entre tus ideas y el mundo</p>

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="email" style="position:absolute;left:-9999px;">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
        </div>
        <div class="field">
          <label for="password" style="position:absolute;left:-9999px;">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Contraseña" required>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">CREAR CUENTA</button>
      </form>
    </div>

    <div class="signup-box">
      <span style="color: var(--text-dim);">¿Ya tienes cuenta?</span>
      <a href="#">Iniciar sesión</a>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg class="toast-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span id="toast-message">Registro exitoso. Bienvenido a MKIVO</span>
  </div>

  <script>
    // Simulación de registro — todavía no conectado a un backend real (FASE 1).
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const toast = document.getElementById('toast');

    function showToast(message) {
      document.getElementById('toast-message').textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(function () {
        toast.classList.remove('show');
      }, 3000);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        showToast('Completa tu correo y contraseña para continuar.');
        return;
      }

      // Guardamos al usuario en localStorage (simulación mientras no hay backend real).
      const usuario = {
        email: email,
        creadoEn: new Date().toISOString()
      };
      localStorage.setItem('mkivo_usuario', JSON.stringify(usuario));

      showToast('Registro exitoso. Bienvenido a MKIVO');
      form.reset();
    });
  </script>

</body>
</html>
