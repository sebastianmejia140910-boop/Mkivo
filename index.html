<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKIVO — Inicia sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --panel-line: #1a1a1a;
    --border: #262626;
    --border-focus: #4f7cff;
    --text: #fafafa;
    --text-dim: #8e8e8e;
    --text-faint: #525252;
    --link: #4f9dff;
    --link-hover: #7cb6ff;
    --btn-bg: #fafafa;
    --btn-bg-hover: #e4e4e4;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100%;
  }

  body{
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr minmax(340px, 400px) 1fr;
    position: relative;
    overflow-x: hidden;
  }

  /* Textura sutil tipo "red de nodos" — evoca el nexo sin invadir el espacio reservado */
  body::before{
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(79,124,255,0.05), transparent 35%),
      radial-gradient(circle at 85% 75%, rgba(79,124,255,0.04), transparent 35%);
    pointer-events: none;
    z-index: 0;
  }

  /* Paneles laterales — reservados para imágenes futuras */
  .side-panel{
    position: relative;
    background: var(--bg);
    border-inline: 1px solid var(--panel-line);
    min-height: 100vh;
  }

  .side-panel--left{ border-left: none; }
  .side-panel--right{ border-right: none; }

  /* Columna central */
  main{
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 32px;
    min-height: 100vh;
    animation: rise 0.5s ease-out;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .auth-card{
    width: 100%;
    max-width: 350px;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 40px 40px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo-icon{
    height: 90px;
    margin-bottom: 8px;
    width: auto;
    object-fit: contain;
  }

  .logo-text{
    height: 28px;
    margin-bottom: 16px;
    width: auto;
    object-fit: contain;
  }

  /* Respaldo textual si algún logo no carga */
  .logo-fallback{
    display: none;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 32px;
    letter-spacing: -0.02em;
    margin-bottom: 18px;
  }

  .logo-icon.broken,
  .logo-text.broken{
    display: none;
  }
  .logo-text.broken + .logo-fallback{
    display: block;
  }

  .tagline{
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 500;
    text-align: center;
    line-height: 1.5;
    margin: 0 0 24px;
    max-width: 260px;
  }

  form{
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field{
    position: relative;
    width: 100%;
  }

  .field input{
    width: 100%;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 13px;
    padding: 13px 12px 13px 12px;
    outline: none;
    transition: border-color 0.15s ease;
    font-family: inherit;
  }

  .field input::placeholder{
    color: var(--text-faint);
  }

  .field input:focus{
    border-color: var(--border-focus);
    box-shadow: 0 0 0 1px var(--border-focus);
  }

  .field input:-webkit-autofill{
    -webkit-box-shadow: 0 0 0 1000px #000 inset;
    -webkit-text-fill-color: var(--text);
  }

  .submit-btn{
    margin-top: 14px;
    width: 100%;
    background: var(--btn-bg);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    font-family: inherit;
  }

  .submit-btn:hover{
    background: var(--btn-bg-hover);
  }

  .submit-btn:active{
    transform: scale(0.98);
  }

  .divider{
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 20px 0;
    color: var(--text-faint);
    font-size: 12px;
    font-weight: 600;
  }

  .divider::before,
  .divider::after{
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .signup-box{
    width: 100%;
    max-width: 350px;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 20px;
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
  }

  .signup-box a{
    color: var(--link);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.15s ease;
  }

  .signup-box a:hover{
    color: var(--link-hover);
    text-decoration: underline;
  }

  a:focus-visible,
  .submit-btn:focus-visible,
  .field input:focus-visible{
    outline: 2px solid var(--border-focus);
    outline-offset: 2px;
  }

  /* ===== Responsive ===== */
  @media (max-width: 900px){
    body{
      grid-template-columns: 1fr;
    }
    .side-panel{
      display: none;
    }
    main{
      padding: 40px 20px;
    }
  }

  @media (prefers-reduced-motion: reduce){
    main{ animation: none; }
    .submit-btn{ transition: none; }
  }
</style>
</head>
<body>

  <div class="side-panel side-panel--left" aria-hidden="true"></div>

  <main>
    <div class="auth-card">
      <img src="logo_cuadrado.png" alt="" class="logo-icon" onerror="this.classList.add('broken')">
      <img src="logo_texto.png" alt="MKIVO" class="logo-text" onerror="this.classList.add('broken')">
      <span class="logo-fallback">MKIVO</span>

      <p class="tagline">El nexo entre tus ideas y el mundo</p>

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="email" class="sr-only" style="position:absolute;left:-9999px;">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
        </div>
        <div class="field">
          <label for="password" class="sr-only" style="position:absolute;left:-9999px;">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Contraseña" required>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">CREAR CUENTA</button>
      </form>
    </div>

    <div class="signup-box">
      <span style="color: var(--text-dim);">¿Ya tienes cuenta?</span>
      <a href="#">Iniciar sesión</a>
    </div>
  </main>

  <div class="side-panel side-panel--right" aria-hidden="true"></div>

  <script>
    // Simulación de registro — todavía no conectado a un backend real.
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        alert('Completa tu correo y contraseña para continuar.');
        return;
      }

      // Aquí se conectará la lógica real de registro con el backend más adelante.
      alert('Cuenta creada! Bienvenido a MKIVO');
    });
  </script>

</body>
</html>
